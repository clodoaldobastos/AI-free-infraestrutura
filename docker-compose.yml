services:

  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:git
    container_name: freellmapi
    restart: unless-stopped

    networks:
      - AI_local

    ports:
      - "3001:3001"

    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      TRUST_PROXY: "1"
      FREEAPI_BLOCK_PRIVATE_PROVIDER_URLS: "true"
      FREELLMAPI_UPDATE_CHECK: "off"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"

    volumes:
      - freellmapi_data:/app/data

    depends_on:
      - ollama


  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    networks:
      - AI_local

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu


networks:
  AI_local:
    external: true
    name: AI_local


volumes:
  freellmapi_data:
    external: true
    name: freellmapi_freellmapi_data

  ollama_data:
    name: ollama_data